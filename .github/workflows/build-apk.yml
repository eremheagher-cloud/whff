
name: Build Minecraft Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Minecraft Launcher Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 1. Baixar arquivos do repositório
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v7

      # 2. Verificar e juntar as cinco partes
      - name: Verificar partes do projeto
        run: |
          set -e

          for i in 01 02 03 04 05; do
            test -f "project.zip.part${i}"
            echo "Parte ${i} encontrada."
          done

      - name: Juntar e extrair projeto
        run: |
          set -e

          cat project.zip.part* > project.zip

          unzip -t project.zip

          mkdir -p extracted
          unzip -q project.zip -d extracted

          test -f extracted/PojavLauncher-gladiolus/gradlew

          echo "Projeto extraído corretamente."

      # 3. Instalar Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # 5. Instalar ferramentas necessárias
      - name: Instalar ferramentas Android
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

          sdkmanager --list_installed

      # 6. Verificar ambiente
      - name: Verificar Java e Android
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      # 7. Compilar APK
      - name: Compilar Minecraft Launcher APK
        run: |
          set -e

          cd extracted/PojavLauncher-gladiolus

          chmod +x gradlew

          ./gradlew --no-daemon \
            :app_pojavlauncher:assembleDebug

      # 8. Verificar APK
      - name: Verificar arquivo APK
        run: |
          APK_DIR="extracted/PojavLauncher-gladiolus/app_pojavlauncher/build/outputs/apk/debug"

          find "$APK_DIR" -maxdepth 1 -name "*.apk" -type f

          test -n "$(find "$APK_DIR" -maxdepth 1 -name "*.apk" -type f -print -quit)"

      # 9. Disponibilizar APK para download
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Launcher-APK-debug
          path: extracted/PojavLauncher-gladiolus/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
